<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="資格マニアの宅建試験対策。民法の4択問題5問を無料で学習。正誤判定・解説・採点付き。"><title>宅建試験・民法4択クイズ無料5問｜資格マニア</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#1d2b40;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:0 auto;padding:22px 16px 50px}header{background:#142c51;color:white;padding:28px 20px;border-radius:16px;text-align:center}header .tag{color:#f4d58a;font-weight:700;letter-spacing:.1em}h1{font-size:clamp(24px,5vw,35px);margin:12px 0}header p{margin:8px 0;color:#e5ecf5}.panel{background:white;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 3px 14px #182d4d12}.meta{color:#51627c;font-size:14px;font-weight:700}.question{font-size:19px;font-weight:700;line-height:1.7;margin:14px 0 22px}.options{display:grid;gap:11px}.option{width:100%;border:2px solid #dbe3ed;background:white;border-radius:12px;padding:15px;text-align:left;font-size:16px;line-height:1.6;cursor:pointer;color:#21334b}.option:hover:not(:disabled){border-color:#2d639c;background:#f5faff}.option:disabled{cursor:default}.option.correct{border-color:#228457;background:#e8f7ef}.option.wrong{border-color:#c44848;background:#fff0f0}.letter{display:inline-block;background:#e8edf5;border-radius:7px;min-width:30px;text-align:center;padding:3px 5px;margin-right:8px;font-weight:700}.feedback{margin-top:20px;border-radius:12px;background:#f1f5fb;padding:18px;line-height:1.8}.feedback strong{font-size:19px}.hidden{display:none}.actions{margin-top:20px;display:flex;justify-content:flex-end}.primary{background:#173b70;color:white;border:0;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer}.primary:hover{background:#25558f}.progress{height:9px;background:#e1e8f2;border-radius:20px;overflow:hidden;margin-top:18px}.bar{height:100%;background:#caa34c;width:0;transition:width .2s}.score{text-align:center;font-size:32px;font-weight:800;color:#173b70}.sub{text-align:center;color:#53657d}.note{font-size:13px;color:#66758a;line-height:1.7;margin:20px 4px}footer{text-align:center;color:#607086;font-size:13px;margin-top:20px}</style></head><body><main class="wrap"><header><div class="tag">資格マニア｜宅建合格応援</div><h1>宅建試験・民法4択クイズ</h1><p>無料5問｜1問ずつ挑戦して理解を深めよう！</p></header><div class="progress" aria-label="進捗"><div class="bar" id="bar"></div></div><section class="panel" id="quiz"><div class="meta" id="meta"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="actions"><button class="primary hidden" id="next">次の問題へ</button></div></section><section class="panel hidden" id="result"><h2 style="text-align:center">お疲れさまでした！</h2><div class="score" id="score"></div><p class="sub" id="message"></p><div class="actions" style="justify-content:center"><button class="primary" id="restart">もう一度挑戦する</button></div></section><p class="note">※本教材は宅建試験の学習用オリジナル問題です。2026年11月8日時点の民法を前提に作成しています。実際の試験問題ではありません。法改正や個別事情により結論が異なる場合があります。</p><footer>© 資格マニア｜宅建合格応援</footer></main><script>
const questions=[
{topic:'制限行為能力者',q:'17歳のAが、法定代理人の同意を得ずに、自分の所有する自転車をBに売却した。Aは婚姻しておらず、成年者とみなされる事情もない。民法上、正しいものはどれか。',opts:['売買契約は当然に無効となる。','Aまたは法定代理人は、原則として売買契約を取り消すことができる。','Bだけが売買契約を取り消すことができる。','Aが未成年であることをBが知らなければ、売買契約は取り消せない。'],answer:1,exp:'未成年者が法定代理人の同意を得ずにした法律行為は、原則として取り消すことができます（民法5条・120条）。当然に無効になるわけではありません。単に相手方が未成年者だと知らなかったことだけでは取消権は失われません。なお、単に権利を得る行為などには例外があります。'},
{topic:'錯誤',q:'Aは、売買契約の重要な内容について勘違いをして契約した。その勘違いは民法95条の要件を満たし、Aに重大な過失はない。この場合の説明として正しいものはどれか。',opts:['契約は当然に無効となる。','Aは錯誤を理由として契約を取り消すことができる。','Aは相手方の詐欺を証明しなければ取り消せない。','錯誤による取消しは売買契約には認められない。'],answer:1,exp:'民法95条では、法律行為の目的および取引上の社会通念に照らして重要な錯誤など、所定の要件を満たす意思表示は取り消すことができます。現在の民法では「無効」ではなく「取消し」です。'},
{topic:'無権代理',q:'Aから代理権を与えられていないBが、Aの代理人と称して、Cとの間でA所有の土地を売る契約を締結した。表見代理などの特別な事情はない。この場合、正しいものはどれか。',opts:['契約は当然にAに対して効力を生じる。','Bが契約を締結した時点でAは必ず土地を引き渡さなければならない。','Aが追認すれば、原則として契約はAに対して効力を生じる。','Cが契約を承諾した以上、Aは追認を拒めない。'],answer:2,exp:'無権代理人がした契約は、本人が追認しなければ本人に対して効力を生じません（民法113条）。本人Aが追認した場合は、別段の意思表示がない限り、契約時にさかのぼって効力を生じます（民法116条）。'},
{topic:'消滅時効',q:'一般の債権について、債権者が権利を行使できることを知った場合、民法166条1項1号による消滅時効の期間として正しいものはどれか。時効の完成猶予・更新はないものとする。',opts:['知った時から3年間','知った時から5年間','知った時から10年間','知った時から20年間'],answer:1,exp:'民法166条1項1号により、債権は、債権者が権利を行使することができることを知った時から5年間行使しないとき、時効によって消滅します。なお、権利を行使することができる時から10年間という別の起算点もあります。'},
{topic:'相続',q:'Aが死亡し、相続人は配偶者Bと子Cの2人だけである。遺言はなく、相続放棄などもない。この場合、民法上の法定相続分として正しいものはどれか。',opts:['Bが全部を相続する。','Bが3分の2、Cが3分の1を相続する。','BとCがそれぞれ2分の1ずつ相続する。','Bが3分の1、Cが3分の2を相続する。'],answer:2,exp:'配偶者と子が共同相続人となる場合、法定相続分は配偶者が2分の1、子が2分の1です（民法900条1号）。子が複数いる場合は、子の取り分を原則として均等に分けます。'}
];let index=0,score=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;let x=questions[index];el('meta').textContent=`第${index+1}問 / 全${questions.length}問　｜　${x.topic}`;el('question').textContent=x.q;el('options').innerHTML='';x.opts.forEach((label,i)=>{let b=document.createElement('button');b.className='option';let s=document.createElement('span');s.className='letter';s.textContent='ABCD'[i];b.append(s,document.createTextNode(label));b.addEventListener('click',()=>choose(i));el('options').appendChild(b)});el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('bar').style.width=`${index/questions.length*100}%`}function choose(i){if(answered)return;answered=true;let x=questions[index],right=i===x.answer;if(right)score++;[...el('options').children].forEach((b,j)=>{b.disabled=true;if(j===x.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});el('feedback').innerHTML='';let heading=document.createElement('strong');heading.textContent=right?'正解！':'不正解';let detail=document.createElement('p');detail.textContent=`正解：${'ABCD'[x.answer]}　${x.opts[x.answer]}`;let explanation=document.createElement('p');explanation.textContent=x.exp;el('feedback').append(heading,detail,explanation);el('feedback').classList.remove('hidden');el('next').textContent=index===questions.length-1?'結果を見る':'次の問題へ';el('next').classList.remove('hidden');el('bar').style.width=`${(index+1)/questions.length*100}%`}el('next').addEventListener('click',()=>{index++;if(index===questions.length){el('quiz').classList.add('hidden');el('result').classList.remove('hidden');el('score').textContent=`${score} / ${questions.length} 問正解（${Math.round(score/questions.length*100)}%）`;el('message').textContent=score===5?'全問正解！すばらしい！':score>=3?'よくできました！解説も復習しよう。':'解説を復習して、もう一度挑戦してみよう！'}else render()});el('restart').addEventListener('click',()=>{index=0;score=0;el('result').classList.add('hidden');el('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
